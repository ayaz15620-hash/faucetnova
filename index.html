
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaucetNova - Crypto Rewards</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:#edf6ff;font-family:Arial,sans-serif;text-align:center;padding:25px}
.card{max-width:450px;margin:50px auto;background:#10243a;padding:28px;border-radius:18px}
h1{color:#48e0a4}
p{color:#b9c9d8}
button{padding:13px 20px;border:0;border-radius:10px;margin:10px;background:#48e0a4;color:#07111f;font-weight:bold;font-size:16px;cursor:pointer}
#status{margin-top:20px;overflow-wrap:anywhere}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
<h1>FaucetNova</h1>
<p>Your Crypto Rewards Hub</p>

<div id="login">
<p>Login or create your account with Google.</p>
<button id="googleBtn">Continue with Google</button>
</div>

<div id="dashboard" class="hidden">
<h2>Welcome!</h2>
<p id="userName"></p>
<p id="userEmail"></p>
<p>Your FaucetNova account is connected.</p>
<button id="logoutBtn">Logout</button>
</div>

<p id="status">Connecting to Firebase...</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDppgFZVrrTUNPEkbnssY7fHBaLaJ7cTBQ",
  authDomain: "faucetnova-6d55e.firebaseapp.com",
  projectId: "faucetnova-6d55e",
  storageBucket: "faucetnova-6d55e.firebasestorage.app",
  messagingSenderId: "721139042628",
  appId: "1:721139042628:web:498aae3f88c82d3d012f11",
  measurementId: "G-Q7JXW2TP4H"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const status = document.getElementById("status");
const login = document.getElementById("login");
const dashboard = document.getElementById("dashboard");

document.getElementById("googleBtn").addEventListener("click", async () => {
  try {
    status.textContent = "Opening Google sign-in...";
    await signInWithPopup(auth, provider);
  } catch (error) {
    status.textContent = "Login error: " + error.message;
  }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  try {
    await signOut(auth);
    status.textContent = "You are logged out.";
  } catch (error) {
    status.textContent = error.message;
  }
});

onAuthStateChanged(auth, async (user) => {
  if (user) {
    login.classList.add("hidden");
    dashboard.classList.remove("hidden");
    document.getElementById("userName").textContent = user.displayName || "User";
    document.getElementById("userEmail").textContent = user.email || "";

    try {
      await setDoc(doc(db, "users", user.uid), {
        name: user.displayName || "",
        email: user.email || "",
        photoURL: user.photoURL || "",
        createdAt: serverTimestamp()
      }, { merge: true });

      status.textContent = "Account connected successfully!";
    } catch (error) {
      status.textContent = "Profile save error: " + error.message;
    }
  } else {
    login.classList.remove("hidden");
    dashboard.classList.add("hidden");
    status.textContent = "Please sign in to continue.";
  }
});
</script>
</body>
</html>
